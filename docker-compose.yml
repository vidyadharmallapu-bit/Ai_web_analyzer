version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./cybershield.db
      - RAZORPAY_KEY_ID=rzp_test_mockkeyid
      - RAZORPAY_KEY_SECRET=mocksecret
    volumes:
      - ./cybershield.db:/app/cybershield.db
    restart: always
